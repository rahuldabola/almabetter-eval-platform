# Local / single-host stack: nginx -> api, worker(s), postgres.
# Production swaps postgres for RDS, local volume for S3, polling for SQS (see docs/DESIGN.md §9).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval
      POSTGRES_DB: eval
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://eval:eval@db:5432/eval
    volumes: [storage:/data]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://eval:eval@db:5432/eval
    volumes: [storage:/data]
    depends_on: { db: { condition: service_healthy } }
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 2g }   # bound the blast radius of a hostile upload

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]

volumes:
  pgdata:
  storage:
