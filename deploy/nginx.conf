limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream api { server api:8000; keepalive 16; }

server {
    listen 80;
    server_tokens off;

    # PoC uploads go through the API; in production uploads go straight to S3
    # via presigned URLs and this limit drops to a few MB.
    client_max_body_size 2g;
    client_body_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz { proxy_pass http://api; access_log off; }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
